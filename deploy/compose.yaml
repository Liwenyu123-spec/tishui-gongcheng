services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
      MYSQL_DATABASE: water_dispatch
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/sql/001_water_dispatch.sql:/docker-entrypoint-initdb.d/001_water_dispatch.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
      MYSQL_DATABASE: water_dispatch
      RAG_EMBEDDING_PROVIDER: hash
      RAG_RERANK_ENABLED: "0"
      RAG_STARTUP_MODE: background
      AGENT_LLM_ENABLED: "0"
      PHOTO_STORE_DIR: /app/backend/data/site_photos
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - knowledge_data:/app/backend/data/knowledge
      - chroma_data:/app/backend/data/rag_chroma_db
      - photos_data:/app/backend/data/site_photos
      - hf_cache:/app/backend/data/hf_cache
    restart: unless-stopped

volumes:
  mysql_data:
  knowledge_data:
  chroma_data:
  photos_data:
  hf_cache:
